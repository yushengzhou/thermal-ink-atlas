<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal-Ink Atlas · __TITLE__</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3ecdd; color: #2b2621;
    font: 14px/1.4 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  #atlas { display: block; cursor: grab; touch-action: none; }
  #atlas:active { cursor: grabbing; }
  .hand { font-family: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", cursive; }
  #cartouche { position: fixed; left: 18px; top: 14px; padding: 10px 16px 9px; background: rgba(246,240,226,.9);
    border: 1.5px solid #2b2621; border-radius: 3px 9px 4px 8px; box-shadow: 2px 3px 0 rgba(43,38,33,.18); max-width: 360px; }
  #cartouche h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
  #cartouche p { margin: 2px 0 0; font-size: 13px; opacity: .8; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center;
    padding: 8px 16px; background: rgba(246,240,226,.92); border: 1.5px solid #2b2621; border-radius: 8px 3px 9px 4px; }
  #bar input[type=range] { width: min(46vw, 420px); accent-color: #9a4a33; }
  #hourLabel { min-width: 150px; font-variant-numeric: tabular-nums; }
  #keys { font-size: 12px; opacity: .75; }
  kbd { font: 12px/1 ui-monospace, Menlo, monospace; border: 1px solid #2b2621; border-radius: 3px; padding: 1px 4px; background: #fbf7ee; }
  #legend { position: fixed; right: 18px; top: 18px; width: 240px; padding: 8px 12px; background: rgba(246,240,226,.92);
    border: 1.5px solid #2b2621; border-radius: 6px 3px 8px 3px; transition: opacity .6s; opacity: 0; }
  #legendBar { height: 12px; border: 1px solid #2b2621; margin: 4px 0 2px; }
  #legend .ends { display: flex; justify-content: space-between; font-size: 12px; white-space: nowrap; }
  #legend .cap { font-size: 11px; opacity: .7; margin-top: 2px; }
  #card { display: none; position: fixed; width: 310px; max-height: calc(100vh - 20px); overflow: auto; box-sizing: border-box; padding: 12px 14px; background: #fbf7ee; border: 1.5px solid #2b2621;
    border-radius: 4px 10px 5px 9px; box-shadow: 3px 4px 0 rgba(43,38,33,.2); font-size: 13px; }
  #card h3 { margin: 0 0 2px; font-size: 17px; }
  #card .mat { opacity: .75; margin-bottom: 6px; }
  #card table { width: 100%; border-collapse: collapse; }
  #card td { padding: 2px 0; vertical-align: top; }
  #card td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #card tr.t td { font-weight: bold; color: #8a2f22; }
  #card .unv { display: inline-block; margin-left: 4px; padding: 0 4px; font-size: 10px; border: 1px dashed #8a2f22; color: #8a2f22; border-radius: 3px; }
  #card .note { margin: 8px 0 4px; font-style: italic; }
  #card .src { margin: 4px 0 0; font-size: 11px; opacity: .75; }
  .noui #cartouche, .noui #bar, .noui #legend { display: none; }
  #card .x { position: absolute; right: 6px; top: 4px; border: 0; background: none; font-size: 18px; cursor: pointer; color: #2b2621; }
</style>
</head>
<body>
<canvas id="atlas" aria-label="Hand-inked isometric city block showing urban heat"></canvas>
<div id="cartouche">
  <h1>Thermal-Ink Atlas</h1>
  <p class="hand">__TITLE__</p>
  <p>__SUBTITLE__</p>
</div>
<div id="legend"><div class="hand">surface temperature</div><div id="legendBar"></div>
  <div class="ends"><span id="legendLo"></span><span id="legendHi"></span></div>
  <div class="cap">modelled surface temperature; inputs not yet verified are flagged on the cards</div></div>
<div id="bar">
  <input id="hour" type="range" min="0" max="23.75" step="0.25" value="15" aria-label="hour of day">
  <span id="hourLabel" class="hand"></span>
  <span id="keys"><kbd>T</kbd> heat · <kbd>H</kbd> hour · drag · wheel · click a parcel</span>
</div>
<div id="card" data-open="0"></div>
<script>
__BUNDLE__
</script>
</body>
</html>
